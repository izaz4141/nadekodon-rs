[package]
name = "nadekodon-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nadekodon-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
axum-extra = { version = "0.12.5", features = ["cookie"] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18.0", features = ["v4"] }
anyhow = "1.0.99"
futures = "0.3.31"
reqwest = { version = "0.12.23", features = ["json"] }
librqbit = "8.1.1"
percent-encoding = "2.3.2"
multer = "3.1.0"
nadekodon-core = { path = "../core" }
mime = "0.3.17"
futures-util = "0.3.32"
http-body-util = "0.1.3"
serde_urlencoded = "0.7.1"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
tempfile = "3.24.0"
tokio-util = { version = "0.7.18", features = ["io-util"] }
tower_governor = { version = "0.8.0", features = ["axum", "tracing"], default-features = false }
tower = "0.5.3"
subtle = "2.6.1"
governor = "0.10.4"
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2.4"
time = "0.3.47"
