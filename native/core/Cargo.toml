[package]
name = "nadekodon-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json", "stream", "gzip", "brotli", "deflate", "http2", "rustls-tls", "blocking", "cookies"] }
uuid = { version = "1.18.0", features = ["v4"] }
time = { version = "0.3.41", features = ["macros", "formatting", "parsing", "local-offset"] }
futures = "0.3.31"
anyhow = "1.0.99"
openssl = { version = "0.10.74", features = ["vendored"] }
indexmap = { version = "2.2.6", features = ["serde"] }
serde_json = "1.0"
utoipa = { version = "5.4.0", features = ["macros"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
librqbit = "8.1.1"
hex = "0.4.3"
percent-encoding = "2.3.2"
argon2 = { version = "0.5.3", features = ["alloc", "password-hash", "rand"] }
semver = "1.0.27"
aes-gcm-siv = "0.11.1"

[package.metadata.cargo-machete]
ignored = ["openssl"]
