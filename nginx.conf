server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /app/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Flutter WASM Headers
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # Reverse proxy for the Rust API server
    location /api/ {
        proxy_pass http://127.0.0.1:${NADEKO_SERVER_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running download queries if needed
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    location /img/ {
        proxy_pass $arg_url;
        proxy_set_header Host $proxy_host;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36";
        proxy_set_header Accept "image/*,*/*";
        proxy_redirect off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept" always;

        if ($request_method = "OPTIONS") {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Accept";
            add_header Content-Length 0;
            return 200;
        }

        expires 1h;
    }
}
