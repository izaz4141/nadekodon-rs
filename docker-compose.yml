services:
  # Nadeko~don - Cross-platform download manager with web interface
  # Access web UI at http://localhost:3000
  nadekodon:
    image: ghcr.io/izaz4141/nadekodon-rs:latest
    container_name: nadekodon
    ports:
      - "3000:3000" # Web UI (HTTP) - Also serves API via reverse proxy
      # - "8080:8080" # Direct API access (bypasses web UI) (not needed)
    environment:
      - PUID=1000 # User ID for file ownership (match your host user)
      - PGID=1000 # Group ID for file ownership (match your host group)
      - TZ=Asia/Jakarta # Container timezone - https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - NADEKO_HOME=/home/nadeko # Base data folder for downloads and config
      - NADEKO_SERVER_PORT=8080 # Internal API server port (inside container)
      - NADEKO_SERVER_API_KEY=api_key # API authentication key (required) - CHANGE IN PRODUCTION
      - NADEKO_SERVER_MASTER_KEY=master_key # 64-character hex-encoded master key (required) `openssl rand -hex 32` - CHANGE IN PRODUCTION
      - NADEKO_USERNAME=admin # Web UI login username - CHANGE IN PRODUCTION
      - NADEKO_PASSWORD=admin # Web UI login password - CHANGE IN PRODUCTION
    volumes:
      - ./data/downloads:/home/nadeko/downloads # Downloaded files storage
      - ./data/config:/home/nadeko/config # Application configuration (settings.json, etc.)
      - ./data/logs:/home/nadeko/logs # Server logs
    restart: unless-stopped
