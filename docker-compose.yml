services:
  nadekodon:
    image: ghcr.io/izaz4141/nadekodon-rs:latest
    container_name: nadekodon
    ports:
      - "80:80"       # Web UI (and API via proxy)
      - "8080:8080"   # Direct API access
    environment:
      - NADEKO_HOME=/home/nadeko
      - NADEKO_SERVER_PORT=8080
      - NADEKO_API_KEY=admin_key
      - NADEKO_USERNAME=admin
      - NADEKO_PASSWORD=admin
    volumes:
      - ./data/downloads:/home/nadeko/downloads
      - ./data/config:/home/nadeko/config
    restart: unless-stopped

